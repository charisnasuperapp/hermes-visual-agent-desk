<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Visual Agent Desk — 3D Pixel Cheerful Garden</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Pixel & Modern Readable UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --pixel-border: #2d3748;
            --cheer-gold: #fbbf24;
            --cheer-sky: #38bdf8;
            --cheer-leaf: #4ade80;
            --cheer-coral: #fb7185;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            background-color: #7dd3fc;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
            letter-spacing: -0.5px;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Crisp Pixel Card Styling */
        .pixel-card {
            background: rgba(255, 253, 245, 0.92);
            backdrop-filter: blur(8px);
            border: 3px solid #1e293b;
            box-shadow: 0 6px 0 #1e293b, 0 10px 20px rgba(0,0,0,0.18);
            border-radius: 14px;
        }

        .pixel-card-dark {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(10px);
            border: 3px solid #334155;
            box-shadow: 0 6px 0 #0f172a, 0 12px 24px rgba(0,0,0,0.35);
            border-radius: 14px;
            color: #f8fafc;
        }

        .pixel-btn {
            border: 3px solid #1e293b;
            box-shadow: 0 4px 0 #1e293b;
            transition: all 0.1s ease;
            border-radius: 10px;
            cursor: pointer;
        }

        .pixel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1e293b;
        }

        .pixel-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e293b;
        }

        /* Retro Pixel Canvas Filter when enabled */
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 3D Floating World Labels */
        .world-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.15s ease;
            z-index: 10;
        }

        .world-label:hover {
            transform: translate(-50%, -106%) scale(1.05);
            z-index: 25;
        }

        /* Speech Bubble Animation */
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .speech-bubble {
            animation: floatBubble 2.4s ease-in-out infinite;
            position: relative;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 7px 0;
            border-style: solid;
            border-color: #1e293b transparent;
            display: block;
            width: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #64748b;
            border-radius: 8px;
        }

        /* Scanline subtle overlay for pixel charm */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.03) 50%,
                rgba(0, 0, 0, 0.03)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 0.9; }
            70% { transform: scale(1.25); opacity: 0; }
            100% { transform: scale(1.25); opacity: 0; }
        }
        .pulse-dot::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background-color: inherit;
            animation: pulseRing 1.6s infinite;
            z-index: -1;
        }
    </style>
</head>

    <!-- ================= APPLICATION LOGIC & 3D ENGINE ================= -->
    <script>
        /******************************************************************
         * 1. COZY CHIPTUNE SYNTHESIZER (WEB AUDIO API)
         ******************************************************************/
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq = 520, type = 'square', duration = 0.09, vol = 0.06, slideFreq = null) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if (slideFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Ignore audio context restrictions before user gesture
            }
        }

        function playChime(type = 'select') {
            if (!soundEnabled) return;
            if (type === 'select') {
                playTone(587.33, 'triangle', 0.08, 0.07, 880);
            } else if (type === 'dispatch') {
                playTone(440, 'square', 0.08, 0.05);
                setTimeout(() => playTone(554.37, 'square', 0.08, 0.05), 70);
                setTimeout(() => playTone(659.25, 'square', 0.14, 0.06), 140);
            } else if (type === 'complete') {
                playTone(523.25, 'triangle', 0.09, 0.07);
                setTimeout(() => playTone(659.25, 'triangle', 0.09, 0.07), 85);
                setTimeout(() => playTone(783.99, 'triangle', 0.09, 0.07), 170);
                setTimeout(() => playTone(1046.50, 'triangle', 0.22, 0.08), 255);
            } else if (type === 'packet') {
                playTone(720, 'sine', 0.06, 0.04, 980);
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('icon-audio');
            const btn = document.getElementById('btn-audio');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.replace('bg-slate-300', 'bg-amber-300');
                playChime('select');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.replace('bg-amber-300', 'bg-slate-300');
            }
        }

        const AGENTS = [

                currentTask: 'Menyinkronkan memori antar-agen & antrean misi',
                tools: ['task_router', 'memory_graph', 'agent_handoff', 'verifier'],
                xp: 98,
                icon: 'fa-feather-pointed'
            },
            {
                id: 'athena',
                name: 'Athena Owl',
                role: 'Deep Research & RAG',
                model: 'Hermes-3-Llama-70B',
                stationName: 'Meja Botani Pustaka',
                color: '#10b981',
                hatColor: 0x10b981,
                shirtColor: 0x059669,
                skinColor: 0xfde68a,
                position: { x: -6.2, z: 1.5 },

        // Active Data Packets flying between Hermes Hub and Agent Desks
        const activePackets = [];
        function spawnVisualPacket(fromId, toId, colorHex = 0xfbbf24) {
            const fromAgent = AGENTS.find(a => a.id === fromId) || AGENTS[0];
            const toAgent = AGENTS.find(a => a.id === toId) || AGENTS[1];

            const start = new THREE.Vector3(fromAgent.position.x, 1.6, fromAgent.position.z);
            const end = new THREE.Vector3(toAgent.position.x, 1.6, toAgent.position.z);

            const packetGroup = new THREE.Group();
            const core = new THREE.Mesh(
                new THREE.BoxGeometry(0.38, 0.38, 0.38),
                new THREE.MeshStandardMaterial({
                    color: colorHex,
                    emissive: colorHex,
                    emissiveIntensity: 0.8
                })
            );
            // Tiny pixel wings on the packet
            const w1 = makeBox(0.28, 0.14, 0.08, 0xffffff, false, false);
            w1.position.x = -0.28;
            const w2 = makeBox(0.28, 0.14, 0.08, 0xffffff, false, false);
            w2.position.x = 0.28;
            packetGroup.add(core, w1, w2);
            packetGroup.position.copy(start);
            scene.add(packetGroup);

            activePackets.push({
                mesh: packetGroup,
                start,
                end,
                progress: 0,
                speed: isTurboMode ? 1.8 : 0.95
            });

            totalPacketsSent++;
            document.getElementById('metric-packets').textContent = `${totalPacketsSent} Paket`;
            playChime('packet');

        function updateFloatingLabelsProjection() {
            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;

            AGENTS.forEach(agent => {
                const meshData = agentMeshes[agent.id];
                const el = labelElements[agent.id];
                if (!meshData || !el) return;

                const pos = meshData.worldPos.clone();
                pos.project(camera);

                // Hide if behind camera
                if (pos.z > 1) {
                    el.style.display = 'none';
                    return;
                }

                const x = (pos.x * widthHalf) + widthHalf;
                const y = -(pos.y * heightHalf) + heightHalf;

                el.style.display = 'flex';
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
            });
        }

        function addTelemetryLog(agentName, badgeColor, text) {
            const streamEl = document.getElementById('tab-content-stream');
            const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
            const item = document.createElement('div');
            item.className = 'bg-slate-800/90 border border-slate-700 rounded-lg p-2 transition-all';
            item.innerHTML = `

                    <span class="font-bold text-[11px] px-1.5 py-0.2 rounded text-slate-950" style="background-color: ${badgeColor}">${agentName}</span>

                </div>
                <p class="text-slate-200 text-[11px] leading-relaxed">${text}</p>
            `;
            streamEl.prepend(item);
            if (streamEl.children.length > 25) {
                streamEl.removeChild(streamEl.lastChild);
            }
            if (typeof saveLogToBridge === 'function') {
                saveLogToBridge(agentName, text, badgeColor);

            const agent = AGENTS.find(a => a.id === agentId);

            if (statusLabel) agent.status = statusLabel;

            const speechEl = document.getElementById(`speech-text-${agentId}`);

            renderRoster();
            if (selectedAgentId === agentId) renderInspector();

        /******************************************************************
         * 8. INTERACTIVE WORKFLOWS, MISSIONS & GARDEN ACTIONS
         ******************************************************************/
        let missionTimers = [];

        function clearMissionTimers() {
            missionTimers.forEach(t => clearTimeout(t));
            missionTimers = [];
        }

        function showToast(msg) {
            const banner = document.getElementById('toast-banner');
            document.getElementById('toast-message').textContent = msg;
            banner.classList.remove('opacity-0', '-translate-y-3');
            banner.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                banner.classList.remove('opacity-100', 'translate-y-0');
                banner.classList.add('opacity-0', '-translate-y-3');
            }, 3200);
        }

        function runPresetMission(index) {
            const preset = PRESET_MISSIONS[index] || PRESET_MISSIONS[0];
            executeMissionWorkflow(preset.title, preset.prompt, preset.steps, preset.artifact);
        }

        function dispatchCustomMission() {
            const input = document.getElementById('mission-input');
            const promptText = input.value.trim();
            if (!promptText) {
                showToast('Ketik perintah misi terlebih dahulu atau pilih Misi Cepat!');
                return;
            }
            input.value = '';

            const customSteps = [
                { agent: 'hermes', speech: `Menerima misi: "${promptText.slice(0, 28)}..."`, log: `Hermes mengurai prompt pengguna & menyusun graf eksekusi.` },
                { agent: 'athena', speech: 'Mengumpulkan referensi & konteks pengetahuan...', log: `Athena memvalidasi data pendukung untuk: "${promptText}".` },
                { agent: 'hephaestus', speech: 'Menulis modul kode & solusi teknis!', log: 'Hephaestus mengeksekusi sintesis kode di sandbox.' },
                { agent: 'iris', speech: 'Memoles antarmuka & merangkum artefak!', log: 'Iris menyelesaikan presentasi hasil kerja tim.' }
            ];

            const customArtifact = `// ==================================================
// HERMES MULTI-AGENT DELIVERABLE
// Misi: ${promptText}
// Status: SELESAI & TERVERIFIKASI
// ==================================================

export async function executeHermesSolution() {
  const orchestration = {
    coordinator: "Hermes Prime (Nous-Hermes-3-405B)",
    researchContext: "Validated by Athena Owl",
    implementation: "Compiled by Hephaestus Forge",
    visualPolish: "Styled by Iris Prism"
  };

  return {
    success: true,
    mission: ${JSON.stringify(promptText)},
    timestamp: "${new Date().toISOString()}",
    orchestration
  };
}`;

            executeMissionWorkflow('Misi Kustom Pengguna', promptText, customSteps, customArtifact);
        }

        function executeMissionWorkflow(title, prompt, steps, artifactText) {
            clearMissionTimers();
            playChime('dispatch');
            showToast(`🚀 Misi Dimulai: ${title}`);
            resetCameraOverview();

            addTelemetryLog('USER MISSION', '#fde047', `Misi Baru: "${prompt}"`);

            steps.forEach((step, idx) => {
                const t = setTimeout(() => {
                    const targetAgent = AGENTS.find(a => a.id === step.agent);
                    if (step.agent !== 'hermes') {
                        spawnVisualPacket('hermes', step.agent, targetAgent ? targetAgent.color : 0xfbbf24);
                    } else {
                        spawnVisualPacket('athena', 'hermes', 0xfbbf24);
                    }

                    updateAgentSpeech(step.agent, step.speech, 'ACTIVE ⚡');
                    if (targetAgent) {
                        targetAgent.currentTask = step.log;
                        addTelemetryLog(targetAgent.name, targetAgent.color, step.log);
                    }

                    // Final step completion
                    if (idx === steps.length - 1) {
                        setTimeout(() => {
                            playChime('complete');
                            document.getElementById('artifact-viewer').textContent = artifactText;
                            document.getElementById('artifact-meta').textContent = `Selesai: ${title}`;
                            switchRightTab('artifact');
                            triggerFireworks();
                            showToast('✨ Misi Selesai! Hasil kerja tersedia di panel kanan.');
                            if (typeof isBridgeOnline !== 'undefined' && isBridgeOnline) {
                                saveArtifactToDrive();
                            }
                        }, 1100);
                    }
                }, idx * 1400);
                missionTimers.push(t);
            });
        }

        function pingSingleAgent(agentId) {
            const agent = AGENTS.find(a => a.id === agentId);
            if (!agent) return;
            spawnVisualPacket('hermes', agent.id, agent.color);
            updateAgentSpeech(agent.id, 'Siap! Paket prioritas diterima! ✨', 'BOOSTED');
            addTelemetryLog(agent.name, agent.color, `Menerima ping langsung dari Supervisor di ${agent.stationName}.`);
        }

        function triggerCoffeeBreak() {
            playChime('complete');
            showToast('🍵 Semua agen menikmati Matcha Latte hangat di taman!');
            AGENTS.forEach(a => {
                updateAgentSpeech(a.id, 'Segar sekali! Terima kasih Matcha-nya! 🍵💚', 'ENERGIZED');
                spawnVisualPacket('hermes', a.id, 0x4ade80);
            });
            addTelemetryLog('GARDEN EVENT', '#4ade80', 'Sesi Matcha Break meningkatkan semangat seluruh agen menjadi 100%!');
        }

        function triggerSpeedBoost() {
            isTurboMode = !isTurboMode;
            playChime('dispatch');
            const tpsEl = document.getElementById('metric-tps');
            if (isTurboMode) {
                tpsEl.textContent = '310 tok/s ⚡';
                showToast('⚡ Turbo Mode Aktif! Kecepatan agen & paket meningkat 2x!');
                addTelemetryLog('HERMES CORE', '#38bdf8', 'Turbo Overclock diaktifkan: Kecepatan pengiriman paket meningkat 200%.');
            } else {
                tpsEl.textContent = '142 tok/s';
                showToast('🌿 Kembali ke ritme taman normal yang santai.');
            }
        }

        function triggerFireworks() {
            AGENTS.forEach(a => {
                if (a.id !== 'hermes') spawnVisualPacket(a.id, 'hermes', a.color);
            });
        }

        /******************************************************************
         * 9. ENVIRONMENT CONTROLS (TIME OF DAY & PIXEL SHADER)
         ******************************************************************/
        function setGardenTime(mode) {
            playChime('select');
            const clockEl = document.getElementById('hud-clock');
            const btns = {
                day: document.getElementById('btn-time-day'),
                sunset: document.getElementById('btn-time-sunset'),
                night: document.getElementById('btn-time-night')
            };

            Object.values(btns).forEach(b => {
                b.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-200 transition flex items-center gap-1.5';
            });

            if (mode === 'day') {
                btns.day.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold bg-sky-400 text-slate-900 border-2 border-slate-800 transition flex items-center gap-1.5';
                scene.background.setHex(0x7dd3fc);
                scene.fog.color.setHex(0x7dd3fc);
                ambientLight.intensity = 0.72;
                dirLight.intensity = 1.15;
                dirLight.color.setHex(0xfffbeb);
                lanternLights.forEach(l => l.intensity = 0.3);
                clockEl.textContent = 'CERAH PAGI';
            } else if (mode === 'sunset') {
                btns.sunset.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold bg-amber-400 text-slate-900 border-2 border-slate-800 transition flex items-center gap-1.5';
                scene.background.setHex(0xfb923c);
                scene.fog.color.setHex(0xfb923c);
                ambientLight.intensity = 0.58;
                dirLight.intensity = 1.05;
                dirLight.color.setHex(0xfde047);
                lanternLights.forEach(l => l.intensity = 1.1);
                clockEl.textContent = 'SENJA KEEMASAN';
            } else if (mode === 'night') {
                btns.night.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-400 text-slate-900 border-2 border-slate-800 transition flex items-center gap-1.5';
                scene.background.setHex(0x0f172a);
                scene.fog.color.setHex(0x0f172a);
                ambientLight.intensity = 0.32;
                dirLight.intensity = 0.35;
                dirLight.color.setHex(0x818cf8);
                lanternLights.forEach(l => l.intensity = 2.2);
                clockEl.textContent = 'MALAM LENTERA';
            }
        }

        function togglePixelMode() {
            playChime('select');
            const label = document.getElementById('pixel-mode-label');
            if (pixelScaleMode === 'hd') {
                pixelScaleMode = 'retro';
                // Lower internal WebGL render resolution for crunchy retro 3D pixel shader feel
                renderer.setPixelRatio(0.42);
                label.textContent = 'Retro 16-Bit';
                showToast('👾 Mode Visual: Retro 16-Bit Crunchy Pixel 3D!');
            } else {
                pixelScaleMode = 'hd';
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                label.textContent = 'HD Pixel';
                showToast('✨ Mode Visual: Crisp HD-2D Voxel Garden!');
            }
        }

        function switchRightTab(tab) {
            const streamContent = document.getElementById('tab-content-stream');
            const artifactContent = document.getElementById('tab-content-artifact');
            const btnStream = document.getElementById('tab-btn-stream');
            const btnArtifact = document.getElementById('tab-btn-artifact');

            if (tab === 'stream') {
                streamContent.classList.remove('hidden');
                artifactContent.classList.add('hidden');
                btnStream.className = 'text-[11px] font-bold px-2 py-0.5 rounded bg-amber-400 text-slate-900';
                btnArtifact.className = 'text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700';
            } else {
                streamContent.classList.add('hidden');
                artifactContent.classList.remove('hidden');
                btnArtifact.className = 'text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-400 text-slate-900';
                btnStream.className = 'text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700';
            }
        }

        function copyArtifactContent() {
            const text = document.getElementById('artifact-viewer').textContent;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            playChime('select');
            showToast('📋 Output berhasil disalin ke Clipboard!');
        }

        function toggleLeftPanel() {
            const panel = document.getElementById('left-panel');
            panel.classList.toggle('-translate-x-[120%]');
        }

        /******************************************************************
         * 10. MOUSE / TOUCH CAMERA ORBIT & RAYCAST CLICKING
         ******************************************************************/
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let downTime = 0;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            camState.isDragging = true;
            camState.prevX = e.clientX;
            camState.prevY = e.clientY;
            downTime = performance.now();
        });

        window.addEventListener('pointermove', (e) => {
            if (!camState.isDragging) return;
            const dx = e.clientX - camState.prevX;
            const dy = e.clientY - camState.prevY;
            camState.prevX = e.clientX;
            camState.prevY = e.clientY;

            camState.theta -= dx * 0.007;
            camState.phi = Math.max(0.35, Math.min(1.38, camState.phi - dy * 0.006));
        });

        window.addEventListener('pointerup', (e) => {
            const elapsed = performance.now() - downTime;
            camState.isDragging = false;

            // If quick click/tap, raycast to see if an agent station was clicked
            if (elapsed < 220) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(interactableMeshes, false);
                if (hits.length > 0 && hits[0].object.userData.agentId) {
                    selectAgent(hits[0].object.userData.agentId, true);
                }
            }
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            camState.desiredRadius = Math.max(8, Math.min(34, camState.desiredRadius + e.deltaY * 0.015));
        }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /******************************************************************
         * 11. MAIN ANIMATION LOOP & AUTONOMOUS GARDEN LIFE
         ******************************************************************/
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const dt = 0.016;

            const speedMult = isTurboMode ? 2.0 : 1.0;

            // 1. Animate Central Hermes Golden Crystal & Water
            if (fountainCristal) {
                fountainCristal.rotation.y = t * 1.4 * speedMult;
                fountainCristal.position.y = 2.05 + Math.sin(t * 3) * 0.14;
            }
            if (fountainWaterRing) {
                fountainWaterRing.scale.x = 1 + Math.sin(t * 4) * 0.025;
                fountainWaterRing.scale.z = 1 + Math.cos(t * 4) * 0.025;
            }

            // 2. Animate Koi Fish in the Garden Pond
            koiFishList.forEach(koi => {
                koi.angle += dt * koi.speed * speedMult;
                koi.mesh.position.x = Math.cos(koi.angle) * koi.radius;
                koi.mesh.position.z = Math.sin(koi.angle) * (koi.radius * 0.75);
                koi.mesh.rotation.y = -koi.angle - Math.PI / 2;
            });

            // 3. Animate Each Agent (Bobbing, Typing Arms, Looking Around)
            AGENTS.forEach((agent, idx) => {
                const m = agentMeshes[agent.id];
                if (!m) return;

                // Cheerful bounce while working
                m.charGroup.position.y = 0.16 + Math.abs(Math.sin(t * 4.5 * speedMult + idx)) * 0.08;
                // Subtle head look
                m.head.rotation.y = Math.sin(t * 2.0 + idx * 1.7) * 0.22;
                // Typing arms animation
                m.armL.rotation.x = -0.7 + Math.sin(t * 12 * speedMult + idx) * 0.25;
                m.armR.rotation.x = -0.7 + Math.cos(t * 12 * speedMult + idx) * 0.25;
            });

            // 4. Animate Floating Blossom Petals / Sparkles
            particles.forEach(p => {
                p.mesh.position.y -= p.speedY * dt;
                p.mesh.position.x += Math.sin(t + p.phase) * 0.01;
                p.mesh.rotation.x += 0.02;
                p.mesh.rotation.y += 0.03;
                if (p.mesh.position.y < 0.2) {
                    p.mesh.position.y = 7.5;
                }
            });

            // 5. Animate Active Messenger Data Packets along parabolic arcs
            for (let i = activePackets.length - 1; i >= 0; i--) {
                const pkt = activePackets[i];
                pkt.progress += dt * pkt.speed;
                if (pkt.progress >= 1) {
                    scene.remove(pkt.mesh);
                    activePackets.splice(i, 1);
                } else {
                    pkt.mesh.position.lerpVectors(pkt.start, pkt.end, pkt.progress);
                    // Parabolic arc height
                    pkt.mesh.position.y += Math.sin(pkt.progress * Math.PI) * 2.4;
                    pkt.mesh.rotation.y += 0.15;
                }
            }

            // 6. Update Camera & Floating HTML Labels
            updateCameraPosition();
            updateFloatingLabelsProjection();

            renderer.render(scene, camera);
        }

        // Periodic Autonomous Background Activity so the garden feels alive immediately
        function startAutonomousGardenPulse() {
            const idleChatter = [
                { id: 'hermes', msg: 'Menjaga sinkronisasi memori taman 100%!', log: 'Hermes melakukan health-check pada seluruh stasiun agen.' },
                { id: 'athena', msg: 'Menemukan paper baru tentang Agentic Memory! 📚', log: 'Athena mengindeks 3 dokumen referensi baru ke Vector DB.' },
                { id: 'hephaestus', msg: 'Build selesai dalam 120ms! Semua test hijau ✅', log: 'Hephaestus menyelesaikan optimasi pipeline CI/CD.' },
                { id: 'iris', msg: 'Menambahkan efek kilau bunga sakura di UI 🌸', log: 'Iris memperbarui komponen tema visual Pixel HD.' }
            ];

            let stepIdx = 0;
            setInterval(() => {
                const item = idleChatter[stepIdx % idleChatter.length];
                const agent = AGENTS.find(a => a.id === item.id);
                if (agent) {
                    spawnVisualPacket('hermes', agent.id, agent.color);
                    updateAgentSpeech(agent.id, item.msg);
                    addTelemetryLog(agent.name, agent.color, item.log);
                }
                stepIdx++;
            }, 6500);
        }

        /******************************************************************
         * 12. LOCAL MICRO BRIDGE INTEGRATION (DATA AUTO-SAVE)
         ******************************************************************/
        const BRIDGE_API = 'http://localhost:8765/api';
        let isBridgeOnline = false;

        async function checkBridgeStatus(notifyUser = false) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1800);
                const res = await fetch(`${BRIDGE_API}/status`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    isBridgeOnline = true;
                    updateBridgeUI(true, data.data_dir);
                    if (notifyUser) showToast('✨ Drive Bridge Terhubung! Auto-save aktif.');
                    return true;
                }
            } catch (e) {
                // Bridge offline
            }

            isBridgeOnline = false;
            updateBridgeUI(false);
            if (notifyUser) showToast('⚠️ Bridge belum aktif. Jalankan run_desk.bat');
            return false;
        }

        function updateBridgeUI(online, dirPath = '') {
            const dot = document.getElementById('bridge-dot');
            const label = document.getElementById('bridge-label');
            const pill = document.getElementById('bridge-status-pill');
            if (!dot || !label) return;

            if (online) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm animate-pulse';
                label.textContent = 'Bridge Aktif';
                label.className = 'hidden lg:inline text-[11px] text-emerald-700 font-semibold';
                if (pill) pill.title = `Micro Bridge Aktif -> Menyimpan ke: ${dirPath}`;
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-400';
                label.textContent = 'Bridge Offline';
                label.className = 'hidden lg:inline text-[11px] text-slate-500';
                if (pill) pill.title = 'Micro Bridge Offline (Klik untuk cek atau jalankan run_desk.bat)';
            }
        }

        async function saveLogToBridge(agentName, text, badgeColor) {
            if (!isBridgeOnline) return;
            try {
                await fetch(`${BRIDGE_API}/save_log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent: agentName,
                        text: text,
                        color: badgeColor,
                        timestamp: new Date().toISOString()
                    })
                });
            } catch (e) {}
        }

        async function saveArtifactToDrive() {
            const content = document.getElementById('artifact-viewer').textContent;
            const meta = document.getElementById('artifact-meta').textContent || 'hermes_artifact';
            playChime('select');

            if (isBridgeOnline) {
                try {
                    const res = await fetch(`${BRIDGE_API}/save_artifact`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: meta,
                            content: content
                        })
                    });
                    const data = await res.json();
                    if (data && data.success) {
                        playChime('complete');
                        showToast(`💾 Tersimpan di: data/artifacts/${data.filename}`);
                        addTelemetryLog('DRIVE BRIDGE', '#38bdf8', `Tersimpan: ${data.filename}`);
                        return;
                    }
                } catch (e) {
                    console.warn('Bridge save failed, fallback to download', e);
                }
            }

            // Fallback download if bridge is offline
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hermes_${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('💾 Berkas diunduh via Browser (Bridge Offline)');
        }

        // Start Everything on Window Load
        window.onload = function () {
            renderRoster();
            renderInspector();

            // Initial logs & default artifact
            addTelemetryLog('HERMES CORE', '#f59e0b', 'Sistem Hermes Visual Agent Desk v3.8 siap di Taman Pixel 3D HD.');
            addTelemetryLog('ATHENA OWL', '#10b981', 'Terhubung ke indeks pengetahuan & pencarian semantik.');
            addTelemetryLog('HEPHAESTUS', '#f43f5e', 'Sandbox eksekusi kode siap menerima kompilasi.');
            addTelemetryLog('IRIS PRISM', '#a855f7', 'Engine visual Pixel HD-2D berjalan pada 60 FPS.');

            document.getElementById('artifact-viewer').textContent = PRESET_MISSIONS[0].artifact;

            // Spawn a welcome packet
            setTimeout(() => spawnVisualPacket('hermes', 'athena', 0x10b981), 600);
            setTimeout(() => spawnVisualPacket('hermes', 'hephaestus', 0xf43f5e), 1000);

            // Connect to local micro bridge
            checkBridgeStatus();
            setInterval(checkBridgeStatus, 10000);

            startAutonomousGardenPulse();
            animate();
        };
    </script>
